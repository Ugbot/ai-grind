# The project-map scripts run on whatever python3 a user's project has, so
# they stay compatible with Python 3.9: zip(strict=) (3.10+) is not available.
extend = "../../pyproject.toml"
target-version = "py39"

[lint]
extend-ignore = ["B905"]

[lint.per-file-ignores]
"skills/project-map/scripts/kb.py" = ["E501"]  # the symbol regex table
