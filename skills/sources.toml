# Harvest map for the unified skills/commands/agents library.
#
# One [[item]] row per asset. This is the single source of truth and the
# bounded work-list for harvest.py -- there is NO recursive disk crawling.
#
# Fields:
#   src      absolute path to the asset. A directory => folder-form skill
#            (copied whole, bundled assets preserved). A *.md file => single
#            file (skills are wrapped into <name>/SKILL.md by harvest.py).
#   type     "skill" | "command" | "agent" | "archive"
#   category sub-folder under catalog/<type>s/ (forward slashes allowed)
#   note     optional human note
#
# Dedup decisions baked in here (canonical copy chosen, duplicates omitted):
#   - llm-station-* skills: taken from the project (.claude), NOT the 3x copies
#     under .agents / src/ralph / global ~/.claude.
#   - build-* commands: taken from chukonu (identical to global copies).
#   - debug-windows-msvc / debug-linux-lldb: only exist in global ~/.claude.

