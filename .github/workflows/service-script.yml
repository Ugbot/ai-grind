name: Windows service script

on:
  pull_request:
  push:
    branches: [main]

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows PowerShell 5.1 service logic
        shell: powershell
        run: ./scripts/test-devtools-service.ps1
      - name: Test PowerShell 7 service logic
        shell: pwsh
        run: ./scripts/test-devtools-service.ps1
