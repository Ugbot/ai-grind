// Injected by devtools-mcp for the `outdated` verb via --init-script.
// Applies the ben-manes versions plugin without touching any project build file
// and makes dependencyUpdates emit JSON to build/dependencyUpdates/report.json.
// First run downloads the plugin from the Plugin Portal (needs network).
initscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath "com.github.ben-manes:gradle-versions-plugin:0.52.0"
    }
}

allprojects {
    apply plugin: com.github.benmanes.gradle.versions.VersionsPlugin
    tasks.matching { it.name == "dependencyUpdates" }.configureEach {
        outputFormatter = "json"
        outputDir = "build/dependencyUpdates"
        reportfileName = "report"
        checkForGradleUpdate = false
    }
}
